services:
  postgres:
    image: postgres:16-alpine
    container_name: voice-survey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice_survey
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice_survey"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
